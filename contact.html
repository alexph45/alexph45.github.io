<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Alexandre Pech--Rossell</title>
    <meta name="description" content="Contacter alexandre-Pech--Rossell.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="site-header"></div>
    <main id="contenu" class="container">
        <section class="page-hero reveal">
            <div class="section-kicker">Contact</div>
            <h1>Vous cherchez <span class="accent">à me contacter</span> ?</h1>
            <p>Une question ou simplement envie d'échanger ? Envoyez-moi un message.</p>
        </section>
        <div class="contact-layout">
            <div class="contact-card reveal">
                <form id="contactForm">
                    <div class="mb-4"><label class="form-label" for="nom">Votre nom</label><input class="form-control"
                            id="nom" name="nom" required autocomplete="name"></div>
                    <div class="mb-4"><label class="form-label" for="email">Votre adresse email</label><input
                            class="form-control" id="email" name="email" type="email" required autocomplete="email">
                    </div>
                    <div class="mb-4"><label class="form-label" for="msg">Votre message</label><textarea
                            class="form-control" id="msg" name="message" rows="7" required></textarea></div><button
                        class="btn btn-primary" type="submit">Préparer le message ↗</button>
                </form>
            </div>
            <aside class="contact-card reveal delay-1">
                <div class="section-kicker mb-2">Direct</div>
                <h2 class="h3">Mes coordonnées</h2><a class="contact-link"
                    href="mailto:alexandrepech45@gmail.com"><strong>Email</strong><span>Alexandre Pech--Rossell ↗</span></a><a
                    class="contact-link" href="https://www.linkedin.com/in/alexandre-pech--rossell/" target="_blank"
                    rel="noopener noreferrer"><strong>LinkedIn</strong><span>Mon LinkedIn ↗</span></a><a class="contact-link"
                    href="https://github.com/alexph45" target="_blank"
                    rel="noopener noreferrer"><strong>GitHub</strong><span>Mon Github ↗</span></a>
            </aside>
        </div>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
